[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 1000
max_height      = 1200
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
]
extract = [
  { run = 'unar "$1"', desc = "Extract here", for = "unix" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]

[open]
rules = [
  { mime = "inode/directory", use = ["edit", "open"] },
  { mime = "text/*",      use = ["edit"] },
  { mime = "image/*",     use = ["open"] },
  { mime = "video/*",     use = ["play"] },
  { mime = "audio/*",     use = ["play"] },
  { mime = "application/pdf",       use = ["open"] },
  { mime = "application/zip",       use = ["extract"] },
  { mime = "application/x-7z-compressed", use = ["extract"] },
  { mime = "application/x-tar",     use = ["extract"] },
  { mime = "application/x-bzip2",   use = ["extract"] },
  { mime = "application/x-bzip",    use = ["extract"] },
  { mime = "application/x-gzip",    use = ["extract"] },
  { mime = "application/x-rar",     use = ["extract"] },
  { mime = "application/xz",        use = ["extract"] },
  { mime = "*",                     use = ["edit", "open"] },
]

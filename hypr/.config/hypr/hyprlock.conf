# Refined editorial Gruvbox — hyprlock
#
# Atmosphere : noise 0.028 (visible film grain) · brightness 0.7 (focus on type)
# Tokens     : input radius 4 (inner) · 24px vertical offsets (grid)
# Accent     : br-yellow = focus  ·  br-red = fail  ·  br-orange = capslock
#
# Palette ref:
# bg=#282828  bg1=#3c3836  fg=#ebdbb2  fg1=#d5c4a1
# br-yellow=#fabd2f  br-red=#fb4934  br-orange=#fe8019

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.7
    contrast    = 0.95
    noise       = 0.028
}

# Clock — display moment; tabular-aware bold mono pending serif swap (Move 4)
label {
    monitor     =
    text        = cmd[update:1000] date +%H:%M
    color       = rgba(235, 219, 178, 1.0)
    font_size   = 96
    font_family = EB Garamond Bold
    position    = 0, 144
    halign      = center
    valign      = center
}

# Date — caption beneath clock
label {
    monitor     =
    text        = cmd[update:60000] date "+%A, %d %B %Y"
    color       = rgba(213, 196, 161, 0.85)
    font_size   = 18
    font_family = EB Garamond Italic
    position    = 0, 56
    halign      = center
    valign      = center
}

# Hairline — 4px br-yellow rule between date and clock
shape {
    monitor     =
    size        = 64, 4
    color       = rgba(250, 189, 47, 0.6)
    position    = 0, 100
    halign      = center
    valign      = center
}

# Monogram — CR bottom-right, JetBrainsMono Bold, low opacity
label {
    monitor     =
    text        = CR
    color       = rgba(250, 189, 47, 0.4)
    font_size   = 14
    font_family = JetBrainsMono Nerd Font Bold
    position    = -24, 24
    halign      = right
    valign      = bottom
}

# Meta — battery % bottom-center
label {
    monitor     =
    text        = cmd[update:30000] bash -c 'BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); echo "${BAT:-?}%"'
    color       = rgba(189, 174, 147, 0.55)
    font_size   = 11
    font_family = Atkinson Hyperlegible
    position    = 0, 24
    halign      = center
    valign      = bottom
}

# Password input — inner radius (token=4); focus-yellow check, br-red fail
input-field {
    monitor           =
    size              = 288, 48
    rounding          = 4
    outline_thickness = 2
    outer_color       = rgb(60, 56, 54)
    inner_color       = rgb(40, 40, 40)
    font_color        = rgb(235, 219, 178)
    check_color       = rgb(250, 189, 47)
    fail_color        = rgb(251, 73, 52)
    capslock_color    = rgb(254, 128, 25)
    font_family       = Atkinson Hyperlegible
    placeholder_text  = <i>password</i>
    fail_text         = <i>$FAIL ($ATTEMPTS)</i>
    fail_timeout      = 2000
    dots_size         = 0.3
    dots_spacing      = 0.2
    dots_center       = true
    fade_on_empty     = true
    position          = 0, -24
    halign            = center
    valign            = center
}

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpmson
}

listener {
    timeout    = 600   # 10 min: lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 900   # 15 min: turn off displays
    on-timeout = hyprctl dispatch dpmsoff
    on-resume  = hyprctl dispatch dpmson
}

listener {
    timeout    = 1800  # 30 min: hibernate
    on-timeout = systemctl hibernate
}

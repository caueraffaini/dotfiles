### feral gamemode — stowed via `gamemode` dotfiles pkg.
###
### CAVEAT: power-sync.sh (10s loop) OWNS the CPU governor:
###   AC      -> performance
###   battery -> forces `balanced` every <=10s
### gamemode also switches governor -> performance for the game lifetime.
###   On AC      : both want performance -> no conflict (supported path).
###   On battery : governor flaps every <=10s. GAME ON AC. iGPU battery
###                gaming is poor regardless (thermal + ~15min runtime).
### Do NOT edit power-sync.sh to "fix" this — AC is the supported path.

[general]
renice=15
softrealtime=auto
inhibit_screensaver=1
desiredgov=performance
defaultgov=schedutil

### NO [gpu] section: gamemode ignores [gpu] from user config by design
### (only honored from root /etc/gamemode.ini), AND the 680M is an iGPU —
### no dGPU clock/power tuning worth doing (thermal-bound, shares RAM).
### iGPU-class target = FSR + thermal headroom, not GPU overclock.

[custom]
start=/home/caue/.config/hypr/scripts/gamemode-toggle.sh on
end=/home/caue/.config/hypr/scripts/gamemode-toggle.sh off

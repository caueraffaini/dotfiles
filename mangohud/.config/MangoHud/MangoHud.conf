### MangoHud — Gruvbox Material Dark, tuned for Radeon 680M iGPU
### Stowed via `mangohud` dotfiles pkg. Static Gruvbox hex (not palette-templated).

legacy_layout=false
table_columns=3
font_size=20
background_alpha=0.4

## Metrics
gpu_stats
gpu_temp
gpu_load_change
gpu_name
cpu_stats
cpu_temp
cpu_load_change
vram
ram
fps
frametime
frame_timing
engine_version
vulkan_driver

## No frame cap (let gamescope/game decide)
fps_limit=0

## Toggles
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

## Gruvbox Material Dark palette
text_color=ebdbb2
gpu_color=fabd2f
cpu_color=8ec07c
vram_color=d3869b
ram_color=d3869b
engine_color=fe8019
frametime_color=8ec07c
background_color=1d2021
fps_color_change
fps_value=30,50
fps_color=fb4934,fabd2f,b8bb26
